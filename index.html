<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>นักสืบคำยืม</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#f5f0ff,#eef8ff);color:#292535}.app{max-width:900px;margin:auto;padding:16px}.screen{display:none}.on{display:block}.card{background:#fff;border-radius:26px;padding:24px;box-shadow:0 12px 35px #40307818;margin-top:18px}.hero{text-align:center;padding:42px 20px}.logo{font-size:68px}.eyebrow,.pill{display:inline-block;padding:7px 13px;border-radius:99px;background:#eee7ff;color:#5837a6;font-weight:800}h1{font-size:clamp(32px,7vw,52px);color:#52349b;margin:10px 0}h2{margin:8px 0}.muted{color:#6e6978;line-height:1.6}input{width:100%;padding:14px;border:2px solid #e4e0ee;border-radius:15px;margin:18px 0;font-size:17px}button{font:inherit;border:0;border-radius:15px;padding:13px 18px;cursor:pointer;font-weight:800}.primary{background:#6545c5;color:#fff}.secondary{background:#eeeaf3;color:#3b3745}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.stage{text-align:left;background:#fff;border:2px solid #e9e5f0;min-height:145px;position:relative}.stage.open{border-color:#cbbcf0}.stage:disabled{opacity:.48}.stage .icon{font-size:34px}.lock{position:absolute;right:10px;top:10px}.stars{color:#dca52a;margin-top:7px}.stat{background:#f2eff7;border-radius:99px;padding:7px 10px}.stats{display:flex;gap:7px}.barbg{height:10px;background:#eeeaf4;border-radius:99px;margin:15px 0}.bar{height:100%;background:#7452d2;border-radius:99px;width:0}.word{text-align:center;font-size:clamp(38px,9vw,62px);font-weight:900;color:#52349b;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{background:#f5f3f8;color:#292535}.answer.correct{background:#dff6e7;border:2px solid #41ae72}.answer.wrong{background:#ffe3e3;border:2px solid #db5c5c}.feedback{min-height:42px;background:#f7f5fa;border-radius:13px;padding:11px;margin-top:13px;font-weight:750;text-align:center}.result{text-align:center}.bigscore{font-size:54px;font-weight:900;color:#52349b}.tip{background:#fff7d9;border-radius:14px;padding:12px;margin:15px 0;text-align:left}@media(max-width:620px){.grid,.answers{grid-template-columns:1fr}.card{padding:18px}}
</style></head><body><div class="app">

<section id="home" class="screen on"><div class="card hero"><div class="logo">🔎</div><span class="eyebrow">เกมการเรียนรู้ภาษาไทย</span><h1>นักสืบคำยืม</h1><p class="muted">ภารกิจตามหาต้นตอคำ<br>จากภาษาต่างประเทศ 7 กลุ่ม</p><input id="name" maxlength="30" placeholder="พิมพ์ชื่อผู้เล่น"><button class="primary" onclick="start()">เริ่มภารกิจ 🎮</button></div></section>

<section id="map" class="screen"><div class="card"><div class="head"><div><small>นักสืบ</small><br><span id="player" class="pill"></span></div><button class="secondary" onclick="home()">ออก</button></div><h2>🗺️ แผนที่ภารกิจ</h2><p class="muted">ผ่านด่านด้วยคะแนนอย่างน้อย 75% เพื่อปลดล็อกด่านถัดไป</p><div id="mapgrid" class="grid"></div></div></section>

<section id="quiz" class="screen"><div class="card"><div class="head"><button class="secondary" onclick="showMap()">← แผนที่</button><div class="stats"><span class="stat">⭐ <b id="score">0</b></span><span class="stat">❤️ <b id="lives">3</b></span></div></div><div class="barbg"><div id="bar" class="bar"></div></div><small id="stageTitle"></small><div class="word" id="word"></div><h2 style="text-align:center">คำนี้มาจากภาษาใด?</h2><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div style="text-align:center"><button id="next" class="primary" style="display:none;margin-top:12px" onclick="nextQ()">ไปต่อ ➜</button></div></div></section>

<section id="result" class="screen"><div class="card result"><div id="resicon" class="logo">🏆</div><h1 id="restitle"></h1><p id="resstage" class="muted"></p><div id="resscore" class="bigscore"></div><p id="resdetail"></p><div id="tip" class="tip"></div><button class="primary" onclick="showMap()">กลับแผนที่ 🗺️</button></div></section>
</div>

<script>
const stages=[
["📜","บาลี–สันสกฤต","รากศัพท์คลาสสิก",[["ปัญญา",["บาลี–สันสกฤต","จีน","อังกฤษ","ญี่ปุ่น"]],["กษัตริย์",["เขมร","บาลี–สันสกฤต","เกาหลี","ชวา–มลายู"]],["ศีล",["อังกฤษ","จีน","บาลี–สันสกฤต","เขมร"]],["ภาษา",["ญี่ปุ่น","ชวา–มลายู","บาลี–สันสกฤต","เกาหลี"]]]],
["🏛️","เขมร","ร่องรอยคำในราชสำนัก",[["เสด็จ",["จีน","เขมร","อังกฤษ","ญี่ปุ่น"]],["บรรทม",["เกาหลี","บาลี–สันสกฤต","เขมร","จีน"]],["โปรด",["ชวา–มลายู","เขมร","อังกฤษ","ญี่ปุ่น"]],["กำเนิด",["เขมร","จีน","เกาหลี","อังกฤษ"]]]],
["🐉","จีน","ตามรอยคำจากแดนมังกร",[["ก๋วยเตี๋ยว",["จีน","อังกฤษ","ญี่ปุ่น","เขมร"]],["เต้าหู้",["เกาหลี","จีน","ชวา–มลายู","อังกฤษ"]],["บะหมี่",["จีน","ญี่ปุ่น","เขมร","อังกฤษ"]],["เกี๊ยว",["อังกฤษ","จีน","เกาหลี","บาลี–สันสกฤต"]]]],
["⚽","อังกฤษ","คำสมัยใหม่รอบตัว",[["ฟุตบอล",["ชวา–มลายู","อังกฤษ","จีน","เกาหลี"]],["คอมพิวเตอร์",["อังกฤษ","จีน","เขมร","ญี่ปุ่น"]],["อินเทอร์เน็ต",["ญี่ปุ่น","อังกฤษ","จีน","เขมร"]],["แท็กซี่",["อังกฤษ","เกาหลี","จีน","ชวา–มลายู"]]]],
["🎌","ญี่ปุ่น","แดนอาทิตย์อุทัย",[["ซูชิ",["จีน","ญี่ปุ่น","เกาหลี","อังกฤษ"]],["กิโมโน",["ญี่ปุ่น","เขมร","จีน","ชวา–มลายู"]],["คาราโอเกะ",["เกาหลี","อังกฤษ","ญี่ปุ่น","จีน"]],["ซามูไร",["จีน","ญี่ปุ่น","เกาหลี","ชวา–มลายู"]]]],
["🇰🇷","เกาหลี","คำจากวัฒนธรรมร่วมสมัย",[["กิมจิ",["เกาหลี","ญี่ปุ่น","จีน","อังกฤษ"]],["ฮันบก",["จีน","เกาหลี","ญี่ปุ่น","อังกฤษ"]],["แทกวันโด",["อังกฤษ","ชวา–มลายู","เกาหลี","จีน"]],["โอปป้า",["ญี่ปุ่น","เกาหลี","จีน","เขมร"]]]],
["🌴","ชวา–มลายู","ร่องรอยจากโลกมลายู",[["กริช",["ญี่ปุ่น","จีน","ชวา–มลายู","อังกฤษ"]],["บุหงา",["ชวา–มลายู","เขมร","เกาหลี","บาลี–สันสกฤต"]],["ทุเรียน",["จีน","อังกฤษ","ชวา–มลายู","ญี่ปุ่น"]],["มังคุด",["เกาหลี","ชวา–มลายู","เขมร","อังกฤษ"]]]]
];
let player="",stage=0,q=0,score=0,lives=3,correct=0,answered=false;
let unlocked=+localStorage.getItem("wdUnlocked")||0,best=JSON.parse(localStorage.getItem("wdBest")||"{}");
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");scrollTo(0,0)}
function start(){player=document.getElementById("name").value.trim()||"นักสืบ";document.getElementById("player").textContent=player;render();show("map")}
function home(){show("home")}
function render(){let g=document.getElementById("mapgrid");g.innerHTML="";stages.forEach((s,i)=>{let b=document.createElement("button");b.className="stage "+(i<=unlocked?"open":"");b.disabled=i>unlocked;let n=best[i]?.stars||0;b.innerHTML=`<span class="icon">${s[0]}</span><span class="lock">${i<=unlocked?"เปิด":"🔒"}</span><h3>ด่าน ${i+1} • ${s[1]}</h3><small>${s[2]}</small><div class="stars">${"⭐".repeat(n)}${"☆".repeat(3-n)}</div>`;b.onclick=()=>startStage(i);g.appendChild(b)})}
function showMap(){render();show("map")}
function startStage(i){stage=i;q=0;score=0;correct=0;lives=3;document.getElementById("stageTitle").textContent=`ด่าน ${i+1} • ${stages[i][0]} ${stages[i][1]}`;document.getElementById("lives").textContent=3;document.getElementById("score").textContent=0;show("quiz");load()}
function load(){answered=false;let data=stages[stage][3][q],word=data[0],opts=data[1],ans=stages[stage][1];document.getElementById("word").textContent="“"+word+"”";document.getElementById("bar").style.width=(q/4*100)+"%";document.getElementById("answers").innerHTML="";document.getElementById("feedback").textContent="";document.getElementById("next").style.display="none";opts.forEach(x=>{let b=document.createElement("button");b.className="answer";b.textContent=x;b.onclick=()=>answer(b,x,ans);document.getElementById("answers").appendChild(b)})}
function answer(btn,x,ans){if(answered)return;answered=true;document.querySelectorAll(".answer").forEach(b=>b.disabled=true);if(x===ans){btn.classList.add("correct");score+=10;correct++;document.getElementById("feedback").textContent="✅ ถูกต้อง! +10 คะแนน"}else{btn.classList.add("wrong");lives--;document.getElementById("lives").textContent=lives;document.querySelectorAll(".answer").forEach(b=>{if(b.textContent===ans)b.classList.add("correct")});document.getElementById("feedback").textContent="❌ คำตอบคือ “"+ans+"”"}document.getElementById("score").textContent=score;if(lives>0)document.getElementById("next").style.display="inline-block";else setTimeout(()=>finish(false),600)}
function nextQ(){q++;if(q>=4)finish(true);else load()}
function finish(done){let pct=correct*25,stars=pct===100?3:pct>=75?2:pct>=50?1:0;if(done&&pct>=75&&stage===unlocked&&unlocked<6){unlocked++;localStorage.setItem("wdUnlocked",unlocked)}if(stars>(best[stage]?.stars||0)){best[stage]={stars};localStorage.setItem("wdBest",JSON.stringify(best))}document.getElementById("resicon").textContent=done&&pct>=75?"🏆":"💪";document.getElementById("restitle").textContent=done&&pct>=75?"ด่านผ่าน!":"ลองอีกครั้ง";document.getElementById("resstage").textContent=`ด่าน ${stage+1} • ${stages[stage][1]}`;document.getElementById("resscore").textContent=score+" คะแนน";document.getElementById("resdetail").textContent=`ตอบถูก ${correct}/4 ข้อ • ${pct}% • ${"⭐".repeat(stars)}${"☆".repeat(3-stars)}`;document.getElementById("tip").textContent=done&&pct>=75?(stage<6?"🎉 ปลดล็อกด่านถัดไปแล้ว! กลับแผนที่เพื่อไปต่อ":"👑 สุดยอด! ผ่านครบทั้ง 7 ด่านแล้ว"):"💡 ต้องได้อย่างน้อย 75% เพื่อผ่านด่าน ลองใหม่ได้เลย";show("result")}
</script></body></html>
